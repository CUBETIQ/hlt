name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-server:
    name: Test Server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install server dependencies
        working-directory: ./server
        run: bun install

      - name: Validate server syntax & tests
        working-directory: ./server
        run: |
          bun run test
          # Parse-only. Never `require` these: server.js/cluster.js bind a port
          # on load and the job would hang forever.
          node --check server.js
          node --check cluster.js
          node --check lib.js
          node --check hostnames.js

  test-client:
    name: Build & Test Client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install client dependencies
        working-directory: ./client
        run: bun install

      - name: Build & Test client
        working-directory: ./client
        run: |
          bun run build
          bun run test

