name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-server:
    name: Test Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install server dependencies
        working-directory: ./server
        run: bun install

      - name: Validate server syntax & tests
        working-directory: ./server
        run: |
          bun run test
          bun -e "require('./server.js')" --dry-run 2>/dev/null || true

  test-client:
    name: Build & Test Client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install client dependencies
        working-directory: ./client
        run: bun install

      - name: Build client
        working-directory: ./client
        run: bun run build

