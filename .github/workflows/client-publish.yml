name: Publish Client to NPM

on:
  release:
    types: [published]
  push:
    tags:
      - "client-v*"
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "NPM release tag (e.g. latest, beta, next)"
        required: true
        default: "latest"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: ./client
        run: bun install

      - name: Build client
        working-directory: ./client
        run: bun run build

      - name: Set up NPM auth token
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Publish to NPM
        working-directory: ./client
        run: bun publish --access public --tag ${{ github.event.inputs.tag || 'latest' }} || npm publish --access public --tag ${{ github.event.inputs.tag || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
