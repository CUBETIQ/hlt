services:
  hlt-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: cubetiq/hlt-server:latest
    container_name: hlt-server
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CLUSTER_ENABLED=${CLUSTER_ENABLED:-true}
      - WORKERS=${WORKERS:-auto}
      - TRUSTED_HOST=${TRUSTED_HOST:-localhost:3000}
      - TRUSTED_SECRET=${TRUSTED_SECRET:-}
      - SECRET_KEY=${SECRET_KEY:-change_this_secret_key_in_production}
      - VERIFY_TOKEN=${VERIFY_TOKEN:-}
      - PUBLIC_TOKEN_REGISTRATION=${PUBLIC_TOKEN_REGISTRATION:-true}
      - SERVER_API_KEY=${SERVER_API_KEY:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET:-change_this_admin_jwt_secret_in_production}
      - ADMIN_JWT_EXPIRES_IN=${ADMIN_JWT_EXPIRES_IN:-24h}
      - REDIS_ENABLED=${REDIS_ENABLED:-false}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    healthcheck:
      test: ["CMD", "bun", "-e", "require('http').get('http://127.0.0.1:3000/_/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      redis:
        condition: service_healthy
        required: false

  redis:
    image: redis:7-alpine
    container_name: hlt-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  redis-data:
